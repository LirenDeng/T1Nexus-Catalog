  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #111827;
    }

    .catalog-container {
      width: 100%;
      padding: 24px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      border: 1px solid #cfd4dc;
    }

    th,
    td {
      border: 1px solid #cfd4dc;
      padding: 12px 14px;
      text-align: left;
      vertical-align: middle;
      word-break: break-word;
    }

    th {
      background: #f3f4f6;
      font-size: 13px;
      font-weight: 700;
      color: #374151;
    }

    td {
      font-size: 14px;
      background: #ffffff;
    }

    tbody tr:nth-child(even) td {
      background: #fafafa;
    }

    tbody tr:hover td {
      background: #f5f7fa;
    }

    th:nth-child(1),
    td:nth-child(1) {
      width: 50%;
    }

    th:nth-child(2),
    td:nth-child(2) {
      width: 20%;
    }

    th:nth-child(3),
    td:nth-child(3) {
      width: 30%;
    }

    .empty-row td {
      text-align: center;
      color: #6b7280;
      padding: 28px;
    }

    @media (max-width: 700px) {
      .catalog-container {
        padding: 10px;
        overflow-x: auto;
      }

      table {
        min-width: 620px;
      }
    }
  </style>
</head>

    function renderCatalog() {
      const tbody = document.getElementById("catalogBody");
      tbody.innerHTML = "";

      if (catalog.length === 0) {
        const row = document.createElement("tr");
        row.className = "empty-row";

        const cell = document.createElement("td");
        cell.colSpan = 3;
        cell.textContent = "No catalog items available.";

        row.appendChild(cell);
        tbody.appendChild(row);
        return;
      }

      catalog.forEach(item => {
        const row = document.createElement("tr");

        const partNumber = document.createElement("td");
        partNumber.textContent = item.partNumber || "";

        const dataRate = document.createElement("td");
        dataRate.textContent = item.dataRate || "";

        const formFactor = document.createElement("td");
        formFactor.textContent = item.formFactor || "";

        row.appendChild(partNumber);
        row.appendChild(dataRate);
        row.appendChild(formFactor);

        tbody.appendChild(row);
      });
    }

    renderCatalog();
  </script>
