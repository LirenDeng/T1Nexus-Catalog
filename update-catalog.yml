name: Update Catalog Data

on:
  push:
    branches:
      - main
    paths:
      - "catalog.xlsx"
      - "convert_catalog.py"
      - ".github/workflows/update-catalog.yml"

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Excel dependency
        run: pip install openpyxl

      - name: Convert Excel to website data
        run: python convert_catalog.py

      - name: Commit updated catalog JSON
        run: |
          if git diff --quiet catalog-data.json; then
            echo "No catalog changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add catalog-data.json
          git commit -m "Update catalog data from Excel"
          git push
