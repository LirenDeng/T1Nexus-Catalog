<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Catalog</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #111827;
    }

    .catalog-container {
      width: 100%;
      padding: 24px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      border: 1px solid #cfd4dc;
    }

    th,
    td {
      border: 1px solid #cfd4dc;
      padding: 12px 14px;
      text-align: left;
      vertical-align: middle;
      word-break: break-word;
    }

    th {
      background: #f3f4f6;
      font-size: 13px;
      font-weight: 700;
      color: #374151;
    }

    td {
      font-size: 14px;
      background: #ffffff;
    }

    tbody tr:nth-child(even) td {
      background: #fafafa;
    }

    tbody tr:hover td {
      background: #f5f7fa;
    }

    th:nth-child(1),
    td:nth-child(1) {
      width: 25%;
    }

    th:nth-child(2),
    td:nth-child(2) {
      width: 45%;
    }

    th:nth-child(3),
    td:nth-child(3) {
      width: 12%;
    }

    th:nth-child(4),
    td:nth-child(4) {
      width: 18%;
    }

    .message-row td {
      text-align: center;
      color: #6b7280;
      padding: 30px;
    }

    @media (max-width: 800px) {
      .catalog-container {
        padding: 10px;
      }

      table {
        min-width: 900px;
      }
    }
  </style>
</head>

<body>

  <div class="catalog-container">
    <table>
      <thead>
        <tr>
          <th>Part Number</th>
          <th>Product Description</th>
          <th>Data Rate</th>
          <th>Form Factor</th>
        </tr>
      </thead>

      <tbody id="catalogBody">
        <tr class="message-row">
          <td colspan="4">Loading catalog...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    async function loadCatalog() {
      const tbody = document.getElementById("catalogBody");

      try {
        const response = await fetch(
          "catalog-data.json?v=" + Date.now()
        );

        if (!response.ok) {
          throw new Error("Unable to load catalog");
        }

        const catalog = await response.json();

        tbody.innerHTML = "";

        if (!catalog.length) {
          tbody.innerHTML = `
            <tr class="message-row">
              <td colspan="4">No catalog items available.</td>
            </tr>
          `;
          return;
        }

        catalog.forEach(item => {
          const row = document.createElement("tr");

          const partNumber = document.createElement("td");
          partNumber.textContent = item.partNumber || "";

          const productDescription = document.createElement("td");
          productDescription.textContent = item.productDescription || "";

          const dataRate = document.createElement("td");
          dataRate.textContent = item.dataRate || "";

          const formFactor = document.createElement("td");
          formFactor.textContent = item.formFactor || "";

          row.appendChild(partNumber);
          row.appendChild(productDescription);
          row.appendChild(dataRate);
          row.appendChild(formFactor);

          tbody.appendChild(row);
        });

      } catch (error) {
        console.error(error);

        tbody.innerHTML = `
          <tr class="message-row">
            <td colspan="4">Catalog temporarily unavailable.</td>
          </tr>
        `;
      }
    }

    loadCatalog();
  </script>

</body>
</html>
